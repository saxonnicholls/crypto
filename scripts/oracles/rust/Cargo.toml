# The Rust oracles (src/main.rs). Exact versions; Cargo.lock pins the whole tree and docker/oracles builds with
# --locked. Test-only: the library never uses any of these.
[package]
name = "snicholls-crypto-oracle"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
k256 = { version = "=0.14.0", features = ["ecdsa", "schnorr"] }
secp256k1 = { version = "=0.33.1", features = ["recovery", "global-context"] }
ed25519-dalek = "=3.0.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
bip32 = { version = "=0.6.0", features = ["alloc"] }
bip39 = "=3.0.0"
bech32 = "=0.12.0"
bs58 = { version = "=0.5.1", features = ["check"] }
slip10_ed25519 = "=0.1.3"
serde_json = "=1.0.154"
hex = "=0.4.3"

[profile.release]
debug = false
