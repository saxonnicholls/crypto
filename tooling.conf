#  tooling.conf
#  snicholls-crypto
#
#  Copyright 2010-2026 Saxon Herschel Nicholls
#
#  The settings tooling's scripts read (third_party/tooling, README "tooling.conf"). Crypto runs its own
#  check_mirror, check_version and check_public; it takes tooling's single include.

name          = snicholls-crypto
include_root  = include/snicholls/crypto
namespace     = snicholls::crypto
umbrella      = crypto.hpp

single_include.snicholls_crypto = snicholls/crypto/crypto.hpp   # single_include/snicholls_crypto.hpp, the whole library
single_include_inline = include third_party/core/include         # core's headers expanded too: it needs only the standard library

# The pins (scripts/check_pins.py). fuzz/cryptofuzz is a module copied into Cryptofuzz's own tree (build.sh), where
# its Makefile's -I ../../include and ../../fuzzing-headers/include name Cryptofuzz's headers, not paths out of this one
pins_reach_exempt = fuzz/cryptofuzz/Makefile
